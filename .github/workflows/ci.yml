name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust and check tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Install licensed font for API end-to-end tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu-core

      - name: Run real HTTP conversion tests
        env:
          ASCII_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
        run: cargo test --locked --test api_e2e -- --ignored

      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # The build script runs TypeScript checks before creating the Vite bundle.
      - name: Type-check and build frontend
        run: npm run build
